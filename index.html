<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>العصر الحجري</title>

  <!-- Native Mobile Web App (PWA) Meta Tags for iOS & Android -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="العصر الحجري" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#090604" />
  <meta name="application-name" content="العصر الحجري" />

  <!-- App Icon & Apple Touch Startup / Icon Links -->
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;900&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #090604;
      font-family: 'Cairo', sans-serif;
      overscroll-behavior: none;
    }
    .glass-menu {
      background: rgba(16, 12, 9, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(245, 180, 65, 0.34);
      box-shadow: 0 16px 44px rgba(0, 0, 0, 0.85);
    }
    .pose-btn-active {
      background: linear-gradient(135deg, #f59e0b 0%, #b45309 100%) !important;
      color: #fff !important;
      border-color: #fde68a !important;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.45);
    }
    .gold-shimmer {
      text-shadow: 0 0 18px rgba(251, 191, 36, 0.7), 0 0 36px rgba(245, 158, 11, 0.4);
    }
  </style>
</head>
<body class="relative w-screen h-screen overflow-hidden bg-[#090604]">

  <!-- Full-Screen Interactive 2D Scene Canvas -->
  <canvas id="mainCanvas" class="w-full h-full block cursor-pointer"></canvas>

  <!-- Floating Hearts Overlay Canvas (Always on top) -->
  <canvas id="heartsCanvas" class="fixed inset-0 w-full h-full pointer-events-none z-50"></canvas>

  <!-- START MENU OVERLAY (قائمة البداية قبل البدء مع صورة البداية وأيقونة اللعبة) -->
  <div
    id="startScreenOverlay"
    class="fixed inset-0 z-40 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md transition-opacity duration-500"
  >
    <div class="absolute inset-0 bg-gradient-to-t from-[#090604] via-[#090604]/50 to-[#090604]/80 pointer-events-none"></div>

    <!-- Start Card -->
    <div class="glass-menu relative z-10 max-w-md w-full rounded-3xl p-5 sm:p-7 text-center flex flex-col items-center gap-4 border border-amber-400/40">
      <!-- Top small clickable "نحبك يارغودا" button (No emoji) -->
      <button
        id="loveBtnStart"
        class="text-[11px] sm:text-xs font-bold text-pink-200 hover:text-white bg-pink-950/60 hover:bg-pink-900/70 border border-pink-400/35 rounded-full px-4 py-1 transition active:scale-95 shadow-sm"
      >
        نحبك يارغودا
      </button>

      <!-- Main Title requested by user -->
      <h1 class="text-lg sm:text-2xl font-black text-amber-100 gold-shimmer leading-relaxed px-2">
        محاكاة لرغودا لو افترضنا وجودها في العصر الحجري
      </h1>

      <!-- Start Button -->
      <button
        id="startSimBtn"
        class="w-full py-3.5 px-8 rounded-2xl font-black text-base sm:text-lg bg-gradient-to-r from-amber-300 via-yellow-400 to-amber-500 text-stone-950 shadow-lg shadow-amber-500/40 hover:brightness-110 active:scale-95 transition cursor-pointer"
      >
        بدء
      </button>
    </div>
  </div>

  <!-- Minimal Top-Left Settings & Poses Button + Compact Popover (No emojis on options) -->
  <div id="topLeftControls" class="fixed top-3 left-3 z-30 hidden flex-col items-end" dir="rtl">
    <button
      id="menuToggleBtn"
      class="w-10 h-10 rounded-xl glass-menu flex items-center justify-center text-amber-300 hover:text-amber-100 hover:border-amber-400/60 active:scale-95 transition"
      title="الإعدادات والوضعيات"
      aria-label="الإعدادات والوضعيات"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="21" x2="4" y2="14"></line>
        <line x1="4" y1="10" x2="4" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12" y2="3"></line>
        <line x1="20" y1="21" x2="20" y2="16"></line>
        <line x1="20" y1="12" x2="20" y2="3"></line>
        <line x1="1" y1="14" x2="7" y2="14"></line>
        <line x1="9" y1="8" x2="15" y2="8"></line>
        <line x1="17" y1="16" x2="23" y2="16"></line>
      </svg>
    </button>

    <!-- Compact Dropdown Panel (Pure text options without emojis) -->
    <div
      id="settingsPanel"
      class="hidden mt-2 w-60 rounded-2xl glass-menu p-3.5 text-amber-50 space-y-2.5 transition-all"
    >
      <!-- Top small clickable "نحبك يارغودا" & Audio toggle without emojis -->
      <div class="flex items-center justify-between border-b border-amber-500/20 pb-2">
        <button
          id="loveBtnMenu"
          class="text-[11px] font-bold text-pink-200 hover:text-white bg-pink-950/60 hover:bg-pink-900/70 border border-pink-400/35 rounded-full px-3 py-0.5 transition active:scale-95"
        >
          نحبك يارغودا
        </button>
        <button
          id="audioToggleBtn"
          class="px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-stone-900/90 border border-amber-500/30 text-amber-200 hover:bg-stone-800 transition"
        >
          الصوت: مفعل
        </button>
      </div>

      <!-- Poses Grid Only (Zero Emojis) -->
      <div class="grid grid-cols-2 gap-1.5 text-xs">
        <button id="modeWaveBtn" class="col-span-2 py-1.5 px-2.5 rounded-lg font-bold border border-amber-500/25 bg-stone-900/80 text-amber-100 transition pose-btn-active">
          موجة السجود المتتالية
        </button>
        <button id="modePose1Btn" class="py-1.5 px-2 rounded-lg font-semibold border border-amber-500/25 bg-stone-900/80 text-amber-100 hover:bg-stone-800 transition">
          رفع الأيدي
        </button>
        <button id="modePose2Btn" class="py-1.5 px-2 rounded-lg font-semibold border border-amber-500/25 bg-stone-900/80 text-amber-100 hover:bg-stone-800 transition">
          الانحناء
        </button>
        <button id="modePose3Btn" class="col-span-2 py-1.5 px-2 rounded-lg font-semibold border border-amber-500/25 bg-stone-900/80 text-amber-100 hover:bg-stone-800 transition">
          السجود التام
        </button>
        <button id="modePianoBtn" class="col-span-2 py-1.5 px-2.5 rounded-lg font-bold border border-amber-400/40 bg-stone-900/90 text-amber-200 hover:bg-stone-800 transition">
          عزف بيانو
        </button>
        <button id="triggerSmiteBtn" class="col-span-2 py-2 px-2.5 rounded-lg font-black bg-gradient-to-r from-red-600 via-orange-500 to-amber-400 text-white shadow-lg shadow-red-600/40 hover:brightness-110 active:scale-95 transition text-sm">
          الجلد (تفجيرهم!)
        </button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      // ==========================================
      // 0. PWA MANIFEST & SERVICE WORKER SETUP
      // ==========================================
      try {
        if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        }
      } catch (e) {}

      // ==========================================
      // 1. SCENE, START MENU, PIANO & HEARTS STATE
      // ==========================================
      const state = {
        started: false,
        mode: 'wave', // 'wave', 'pose1', 'pose2', 'pose3', 'piano'
        staggerFrames: 4,
        speed: 1.0,
        bloomIntensity: 1.0,
        time: 0,
        sceneElapsed: 0,
        smiteActive: false,
        smiteTimer: 0,
        screenShakeX: 0,
        screenShakeY: 0,
        panicSpeedBoost: 1.0,
        pianoVisibility: 0,
        pianoNoteTimer: 0,
        pianoNoteIndex: 0,
        clapSoundTimer: 0,
        heartsActive: false,
        heartsTimer: 0,
        userDragOffset: 0,
        isDragging: false,
        dragStartX: 0,
        audioEnabled: true,
        audioCtx: null
      };

      // ==========================================
      // 2. WEB AUDIO SYNTHESIZER
      // ==========================================
      const PIANO_SCORE = [
        { note: 523.25, bass: 261.63, dur: 0.34 },
        { note: 659.25, bass: 329.63, dur: 0.34 },
        { note: 783.99, bass: 392.00, dur: 0.34 },
        { note: 1046.50, bass: 523.25, dur: 0.52 },
        { note: 987.77, bass: 392.00, dur: 0.34 },
        { note: 783.99, bass: 329.63, dur: 0.34 },
        { note: 880.00, bass: 220.00, dur: 0.38 },
        { note: 659.25, bass: 329.63, dur: 0.34 },
        { note: 523.25, bass: 261.63, dur: 0.48 },
        { note: 587.33, bass: 293.66, dur: 0.34 },
        { note: 698.46, bass: 349.23, dur: 0.34 },
        { note: 880.00, bass: 440.00, dur: 0.48 },
        { note: 783.99, bass: 392.00, dur: 0.34 },
        { note: 698.46, bass: 349.23, dur: 0.34 },
        { note: 659.25, bass: 329.63, dur: 0.55 },
        { note: 587.33, bass: 246.94, dur: 0.34 },
        { note: 783.99, bass: 392.00, dur: 0.38 },
        { note: 987.77, bass: 493.88, dur: 0.48 },
        { note: 1046.50, bass: 261.63, dur: 0.65 }
      ];

      function ensureAudio() {
        if (!state.audioEnabled) return null;
        if (!state.audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return null;
          state.audioCtx = new AudioContext();
        }
        if (state.audioCtx.state === 'suspended') {
          state.audioCtx.resume();
        }
        return state.audioCtx;
      }

      function toggleAudio() {
        state.audioEnabled = !state.audioEnabled;
        const btn = document.getElementById('audioToggleBtn');
        btn.textContent = state.audioEnabled ? 'الصوت: مفعل' : 'الصوت: مكتوم';
      }

      function playPianoNote(freq, bassFreq) {
        const ctx = ensureAudio();
        if (!ctx) return;
        const now = ctx.currentTime;

        function triggerString(f, gainLevel, duration) {
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          const filter = ctx.createBiquadFilter();
          const env = ctx.createGain();

          osc1.type = 'triangle';
          osc1.frequency.setValueAtTime(f, now);
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(f * 2, now);

          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(f * 4.5, now);
          filter.frequency.exponentialRampToValueAtTime(f * 1.4, now + duration);

          env.gain.setValueAtTime(0.001, now);
          env.gain.linearRampToValueAtTime(gainLevel, now + 0.018);
          env.gain.exponentialRampToValueAtTime(gainLevel * 0.35, now + 0.22);
          env.gain.exponentialRampToValueAtTime(0.0005, now + duration);

          const osc2Gain = ctx.createGain();
          osc2Gain.gain.value = 0.25;

          osc1.connect(filter);
          osc2.connect(osc2Gain);
          osc2Gain.connect(filter);
          filter.connect(env);
          env.connect(ctx.destination);

          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + duration + 0.05);
          osc2.stop(now + duration + 0.05);
        }

        triggerString(freq, 0.14, 1.35);
        if (bassFreq) triggerString(bassFreq, 0.08, 1.55);
      }

      function playLoveHarpGlissando() {
        const ctx = ensureAudio();
        if (!ctx) return;
        const now = ctx.currentTime;
        const notes = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5, 1174.66, 1318.5, 1567.98];
        notes.forEach((f, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          const startT = now + idx * 0.07;
          osc.frequency.setValueAtTime(f, startT);
          gain.gain.setValueAtTime(0.001, startT);
          gain.gain.linearRampToValueAtTime(0.06, startT + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0005, startT + 1.2);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startT);
          osc.stop(startT + 1.25);
        });
      }

      function playSoftClapBurst() {
        const ctx = ensureAudio();
        if (!ctx) return;
        const now = ctx.currentTime;
        const bufLen = Math.floor(ctx.sampleRate * 0.055);
        const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < bufLen; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.018));
        }
        const src = ctx.createBufferSource();
        src.buffer = buf;

        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 1150 + (Math.random() - 0.5) * 350;
        filter.Q.value = 1.8;

        const gain = ctx.createGain();
        gain.gain.value = 0.055;

        src.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        src.start(now);
      }

      function playGroundThud() {
        const ctx = ensureAudio();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(72, now);
        osc.frequency.exponentialRampToValueAtTime(25, now + 0.12);
        gain.gain.setValueAtTime(0.038, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.14);
      }

      function playMassiveExplosionAndScreams() {
        const ctx = ensureAudio();
        if (!ctx) return;
        const now = ctx.currentTime;

        const bufferSize = ctx.sampleRate * 0.9;
        const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.28));
        }
        const whiteNoise = ctx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;

        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(950, now);
        filter.frequency.exponentialRampToValueAtTime(85, now + 0.85);

        const noiseGain = ctx.createGain();
        noiseGain.gain.setValueAtTime(0.42, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.005, now + 0.88);

        whiteNoise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(ctx.destination);
        whiteNoise.start(now);

        const sub = ctx.createOscillator();
        const subGain = ctx.createGain();
        sub.type = 'sawtooth';
        sub.frequency.setValueAtTime(130, now);
        sub.frequency.exponentialRampToValueAtTime(22, now + 0.65);
        subGain.gain.setValueAtTime(0.32, now);
        subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.68);
        sub.connect(subGain);
        subGain.connect(ctx.destination);
        sub.start(now);
        sub.stop(now + 0.7);

        [0.08, 0.18, 0.28].forEach((delay, idx) => {
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(620 + idx * 140, now + delay);
          osc.frequency.exponentialRampToValueAtTime(180, now + delay + 0.55);
          g.gain.setValueAtTime(0.06, now + delay);
          g.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.58);
          osc.connect(g);
          g.connect(ctx.destination);
          osc.start(now + delay);
          osc.stop(now + delay + 0.6);
        });
      }

      // ==========================================
      // 3. HEARTS SWARM & FORMATION ("رغودا ملكة الجمال نحبك")
      // ==========================================
      const heartParticles = [];

      function generateHeartFormationTargets(w, h) {
        const off = document.createElement('canvas');
        const cw = Math.min(900, Math.max(360, Math.floor(w * 0.9)));
        const ch = Math.min(420, Math.max(220, Math.floor(h * 0.55)));
        off.width = cw;
        off.height = ch;
        const octx = off.getContext('2d');

        octx.fillStyle = '#000000';
        octx.fillRect(0, 0, cw, ch);

        const fontSize1 = Math.max(28, Math.min(68, Math.floor(cw * 0.085)));
        const fontSize2 = Math.max(32, Math.min(76, Math.floor(cw * 0.095)));

        octx.fillStyle = '#ffffff';
        octx.textAlign = 'center';
        octx.textBaseline = 'middle';

        octx.font = `900 ${fontSize1}px "Cairo", sans-serif`;
        octx.fillText('رغودا ملكة الجمال', cw * 0.5, ch * 0.36);

        octx.font = `900 ${fontSize2}px "Cairo", sans-serif`;
        octx.fillText('نحبك', cw * 0.5, ch * 0.72);

        const imgData = octx.getImageData(0, 0, cw, ch).data;
        const targets = [];
        const step = Math.max(4, Math.floor(cw / 125));

        const offsetX = (w - cw) * 0.5;
        const offsetY = (h - ch) * 0.45;

        for (let y = 0; y < ch; y += step) {
          for (let x = 0; x < cw; x += step) {
            const idx = (y * cw + x) * 4;
            if (imgData[idx] > 128) {
              targets.push({
                tx: offsetX + x,
                ty: offsetY + y
              });
            }
          }
        }
        return targets;
      }

      function triggerLoveHeartsShow() {
        playLoveHarpGlissando();
        state.heartsActive = true;
        state.heartsTimer = 0;
        heartParticles.length = 0;

        const w = window.innerWidth;
        const h = window.innerHeight;
        const targets = generateHeartFormationTargets(w, h);

        const maxHearts = Math.min(480, Math.max(240, targets.length));
        const colors = ['#f43f5e', '#ec4899', '#fb7185', '#ef4444', '#fde047', '#f9a8d4'];

        for (let i = 0; i < maxHearts; i++) {
          const tgt = targets[Math.floor((i / maxHearts) * targets.length)] || {
            tx: w * 0.5 + (Math.random() - 0.5) * 200,
            ty: h * 0.5 + (Math.random() - 0.5) * 100
          };

          const startX = Math.random() * w;
          const startY = h + 20 + Math.random() * h * 0.4;

          heartParticles.push({
            x: startX,
            y: startY,
            vx: (Math.random() - 0.5) * 260,
            vy: -(240 + Math.random() * 360),
            tx: tgt.tx,
            ty: tgt.ty,
            size: 8 + Math.random() * 7,
            color: colors[i % colors.length],
            phase: Math.random() * Math.PI * 2,
            alpha: 1.0
          });
        }
      }

      function drawHeartShape(ctx, x, y, size, color, alpha) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(x, y);
        ctx.fillStyle = color;
        ctx.beginPath();
        const s = size * 0.5;
        ctx.moveTo(0, s * 0.4);
        ctx.bezierCurveTo(0, -s * 0.3, -s, -s * 0.3, -s, s * 0.2);
        ctx.bezierCurveTo(-s, s * 0.7, 0, s * 1.0, 0, s * 1.3);
        ctx.bezierCurveTo(0, s * 1.0, s, s * 0.7, s, s * 0.2);
        ctx.bezierCurveTo(s, -s * 0.3, 0, -s * 0.3, 0, s * 0.4);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function updateAndRenderHeartsOverlay(dt) {
        const hCanvas = document.getElementById('heartsCanvas');
        const hCtx = hCanvas.getContext('2d');
        const w = window.innerWidth;
        const h = window.innerHeight;

        hCtx.clearRect(0, 0, w, h);
        if (!state.heartsActive) return;

        state.heartsTimer += dt;

        const convergeProgress = smoothstep((state.heartsTimer - 1.1) / 1.4);
        const fadeOutProgress = state.heartsTimer > 6.2 ? smoothstep((state.heartsTimer - 6.2) / 1.2) : 0;
        const masterAlpha = 1 - fadeOutProgress;

        if (masterAlpha <= 0.01) {
          state.heartsActive = false;
          heartParticles.length = 0;
          return;
        }

        if (convergeProgress > 0.05) {
          hCtx.save();
          hCtx.fillStyle = `rgba(18, 6, 12, ${0.58 * convergeProgress * masterAlpha})`;
          hCtx.fillRect(0, 0, w, h);
          hCtx.restore();
        }

        heartParticles.forEach((hp) => {
          if (state.heartsTimer < 1.1) {
            hp.x += hp.vx * dt + Math.sin(state.time * 5 + hp.phase) * 90 * dt;
            hp.y += hp.vy * dt;
            hp.vy += 110 * dt;
          } else {
            const pull = Math.min(1, dt * 6.5);
            const beat = Math.sin(state.time * 7 + hp.phase) * 1.8;
            hp.x = lerp(hp.x, hp.tx, pull);
            hp.y = lerp(hp.y, hp.ty + beat, pull);
          }

          if (state.heartsTimer > 6.2) {
            hp.y -= 95 * dt;
          }

          const pulseSize = hp.size * (1 + Math.sin(state.time * 8 + hp.phase) * 0.14);
          drawHeartShape(hCtx, hp.x, hp.y, pulseSize, hp.color, masterAlpha);
        });

        if (convergeProgress > 0.35) {
          const textAlpha = ((convergeProgress - 0.35) / 0.65) * masterAlpha;
          const cw = Math.min(900, Math.max(360, Math.floor(w * 0.9)));
          const ch = Math.min(420, Math.max(220, Math.floor(h * 0.55)));
          const offsetY = (h - ch) * 0.45;
          const fontSize1 = Math.max(28, Math.min(68, Math.floor(cw * 0.085)));

      // ==========================================

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function smoothstep(t) {
        const c = Math.max(0, Math.min(1, t));
        return c * c * (3 - 2 * c);
      }

      function solveCharacterAnatomy(p, bounceY, time, ch) {
        const hScale = ch.trait.heightScale;
        const breath = Math.sin(time * 3.0 + ch.id * 0.9) * 1.8 * (1 - p * 0.5);

        const k1 = {
          ankle: { x: 0, y: 0 },
          knee: { x: 6, y: -35 * hScale },
          hip: { x: -6, y: -72 * hScale },
          waist: { x: -2, y: (-94 + breath * 0.4) * hScale },
          chest: { x: 5, y: (-120 + breath) * hScale },
          neck: { x: 8, y: (-132 + breath) * hScale },
          head: { x: 11, y: (-146 + breath) * hScale },
          headPitch: -0.45,
          shoulder: { x: 7, y: (-118 + breath) * hScale },
          elbow: { x: 26, y: (-148 + breath * 1.2) * hScale },
          wrist: { x: 40, y: (-178 + breath * 1.4) * hScale },
          handAngle: -0.95
        };

        const k2 = {
          ankle: { x: -6, y: 0 },
          knee: { x: 20, y: -15 * hScale },
          hip: { x: -16, y: -45 * hScale },
          waist: { x: 4, y: -64 * hScale },
          chest: { x: 25, y: -76 * hScale },
          neck: { x: 34, y: -80 * hScale },
          head: { x: 44, y: -82 * hScale },
          headPitch: 0.25,
          shoulder: { x: 24, y: -72 * hScale },
          elbow: { x: 38, y: -45 * hScale },
          wrist: { x: 52, y: -20 * hScale },
          handAngle: 0.65
        };

        const k3 = {
          ankle: { x: -14, y: -2 },
          knee: { x: 19, y: -2 },
          hip: { x: -16, y: -28 * hScale + bounceY },
          waist: { x: 8, y: -42 * hScale + bounceY * 0.9 },
          chest: { x: 34, y: -23 * hScale + bounceY * 0.7 },
          neck: { x: 43, y: -14 + bounceY * 0.4 },
          head: { x: 52, y: -8 + bounceY * 0.3 },
          headPitch: 0.98,
          shoulder: { x: 34, y: -20 + bounceY * 0.6 },
          elbow: { x: 50, y: -7 },
          wrist: { x: 72, y: -2 },
          handAngle: 0.08
        };

        const out = {};
        const keys = Object.keys(k1);
        if (p <= 0.5) {
          const t = smoothstep(p / 0.5);
          keys.forEach((k) => {
            if (typeof k1[k] === 'number') out[k] = lerp(k1[k], k2[k], t);
            else out[k] = { x: lerp(k1[k].x, k2[k].x, t), y: lerp(k1[k].y, k2[k].y, t) };
          });
        } else {
          const t = smoothstep((p - 0.5) / 0.5);
          keys.forEach((k) => {
            if (typeof k2[k] === 'number') out[k] = lerp(k2[k], k3[k], t);
            else out[k] = { x: lerp(k2[k].x, k3[k].x, t), y: lerp(k2[k].y, k3[k].y, t) };
          });
        }

        if (ch.enterProgress < 1 && !ch.blastActive) {
          const walkCycle = Math.sin(state.sceneElapsed * 16 + ch.id * 1.7);
          out.knee.x = 8 + walkCycle * 10;
          out.knee.y = -32 * hScale - Math.abs(walkCycle) * 6;
          out.ankle.x = walkCycle * 14;
          out.ankle.y = -Math.max(0, walkCycle) * 8;
          out.elbow.x = 18 - walkCycle * 10;
          out.elbow.y = -98 * hScale;
          out.wrist.x = 30 - walkCycle * 14;
          out.wrist.y = -112 * hScale;
          out.headPitch = -0.15 + Math.sin(state.sceneElapsed * 16) * 0.08;
        }

        if (state.mode === 'piano' && ch.enterProgress >= 1 && !ch.blastActive) {
          const clapWave = (Math.sin(time * 17 + ch.id * 0.9) + 1) * 0.5;
          const sway = Math.sin(time * 4.2 + ch.id) * 4;
          out.chest.x += sway * 0.5;
          out.head.x += sway * 0.8;
          out.head.y += Math.abs(Math.sin(time * 8.4 + ch.id)) * 3.5;
          out.headPitch = -0.22 + Math.sin(time * 4.2 + ch.id) * 0.1;
          out.elbow.x = 24;
          out.elbow.y = -96 * hScale;
          out.wrist.x = 38 + clapWave * 9;
          out.wrist.y = (-114 + clapWave * 8) * hScale;
          out.handAngle = -0.35 + clapWave * 0.25;
          out.clapWave = clapWave;
        }

        if (ch.blastActive) {
          const flail = Math.sin(time * 28 + ch.id);
          out.wrist.x += flail * 18;
          out.wrist.y -= 25 + Math.cos(time * 28) * 18;
          out.knee.y += flail * 12;
          out.headPitch = -0.65;
        }

        out.p = p;
        return out;
      }

      function drawTaperedLimb(ctx, p1, p2, r1, r2, baseColor, litColor, rimAlpha) {
        const dx = p2.x - p1.x;
        const dy = p2.y - p1.y;
        const len = Math.hypot(dx, dy) || 1;
        const nx = -dy / len;
        const ny = dx / len;

        ctx.save();
        ctx.fillStyle = baseColor;
        ctx.beginPath();
        ctx.moveTo(p1.x + nx * r1, p1.y + ny * r1);
        ctx.lineTo(p2.x + nx * r2, p2.y + ny * r2);
        ctx.arc(p2.x, p2.y, r2, Math.atan2(ny, nx), Math.atan2(-ny, -nx));
        ctx.lineTo(p1.x - nx * r1, p1.y - ny * r1);
        ctx.arc(p1.x, p1.y, r1, Math.atan2(-ny, -nx), Math.atan2(ny, nx));
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = 'rgba(20, 12, 6, 0.72)';
        ctx.lineWidth = 1.4;
        ctx.stroke();

        if (rimAlpha > 0.08 && litColor) {
          ctx.strokeStyle = litColor;
          ctx.lineWidth = 2.0;
          ctx.beginPath();
          ctx.moveTo(p1.x + nx * (r1 * 0.8), p1.y + ny * (r1 * 0.8));
          ctx.lineTo(p2.x + nx * (r2 * 0.8), p2.y + ny * (r2 * 0.8));
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawTribeCharacter(ctx, ch, sceneScale) {
        if (ch.enterProgress <= 0.001) return;

        const rig = solveCharacterAnatomy(ch.p, ch.bounceY, state.time, ch);
        const scale = ch.scale * sceneScale;
